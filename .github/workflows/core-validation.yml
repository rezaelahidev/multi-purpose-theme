name: Core Architecture Validation

on:
  pull_request:
    branches:
      - master
    paths:
      - ".ai/**"
      - ".agents/**"
      - ".cursor/**"
      - ".claude/**"
      - ".codex/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/core-validation.yml"
  push:
    branches:
      - master
      - "feat/**"
    paths:
      - ".ai/**"
      - ".agents/**"
      - ".cursor/**"
      - ".claude/**"
      - ".codex/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/core-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-core:
    name: Validate contracts and workflow references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python scripts
        run: python -m py_compile scripts/validate_core.py scripts/generate_adapters.py
      - name: Validate canonical schemas, records, and references
        run: python scripts/validate_core.py

  validate-generator:
    name: Verify provider adapter generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile generator
        run: python -m py_compile scripts/generate_adapters.py
      - name: Generate provider adapters
        run: python scripts/generate_adapters.py --write
      - name: Verify generated manifest and files
        run: python scripts/generate_adapters.py --check
      - name: Verify deterministic generation
        shell: bash
        run: |
          git diff --binary > /tmp/generated-first-pass.diff
          python scripts/generate_adapters.py --write
          git diff --binary > /tmp/generated-second-pass.diff
          diff -u /tmp/generated-first-pass.diff /tmp/generated-second-pass.diff
