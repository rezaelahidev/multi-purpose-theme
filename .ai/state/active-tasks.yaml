tasks:
  - id: "TASK-CORE-001"
    title: "Review and approve portable AI core architecture"
    status: "READY"
    assigned_agent: "human"
    dependencies: []
    inputs:
      - ".ai/core/architecture.md"
      - ".ai/core/agent-contract.md"
      - ".ai/core/workflow-state.md"
      - ".ai/core/provider-adapter-spec.md"
    expected_outputs:
      - "docs/decisions/ADR-0001-portable-ai-core.md"
    acceptance_criteria:
      - "Four core specifications reviewed"
      - "Repository layout approved"
      - "Provider portability constraints understood"
      - "Manual provider migration smoke test confirmed"
    file_scope:
      include:
        - ".ai/core/**"
        - ".ai/contracts/**"
        - ".ai/adapters/**"
        - "scripts/**"
        - "tests/**"
        - ".cursor/**"
        - ".claude/**"
        - ".codex/**"
        - "docs/architecture/**"
        - "README.md"
        - "requirements-dev.txt"
      exclude:
        - ".ai/state/**"
        - "docs/decisions/**"
    approval:
      required: true
      status: "pending"
  - id: "TASK-AGENTS-001"
    title: "Define and validate the initial WordPress Block Theme agent roster"
    status: "APPROVED"
    assigned_agent: "master-orchestrator"
    dependencies: []
    inputs:
      - ".ai/contracts/agent.schema.json"
      - ".ai/core/agent-contract.md"
      - ".ai/core/provider-adapter-spec.md"
      - ".agents/skills/wordpress-block-theme/SKILL.md"
    expected_outputs:
      - ".ai/agents/product-architect.yaml"
      - ".ai/agents/theme-architect.yaml"
      - ".ai/agents/qa-agent.yaml"
      - "docs/architecture/specialist-agent-roster.md"
      - ".ai/adapters/generated-manifest.json"
    acceptance_criteria:
      - "Each canonical agent validates against the agent JSON Schema"
      - "Each role has bounded responsibilities, inputs, outputs, permissions, and escalation rules"
      - "Product, architecture, and QA responsibilities are independently assigned"
      - "Human approval gates are preserved"
      - "All provider adapters and the generated manifest are synchronized"
      - "GitHub Actions validation passes on the resulting commit"
    file_scope:
      include:
        - ".ai/agents/**"
        - ".ai/state/active-tasks.yaml"
        - ".ai/state/project-status.yaml"
        - ".ai/adapters/generated-manifest.json"
        - ".cursor/agents/**"
        - ".claude/agents/**"
        - ".codex/agents/**"
        - "docs/architecture/specialist-agent-roster.md"
      exclude:
        - "style.css"
        - "templates/**"
        - "parts/**"
        - "patterns/**"
        - "theme.json"
    approval:
      required: true
      status: "approved"
  - id: "TASK-AGENTS-002"
    title: "Define and validate the expanded WordPress Block Theme specialist roster"
    status: "IN_PROGRESS"
    assigned_agent: "master-orchestrator"
    dependencies:
      - "TASK-AGENTS-001"
    inputs:
      - ".ai/contracts/agent.schema.json"
      - ".ai/core/agent-contract.md"
      - ".ai/core/provider-adapter-spec.md"
      - ".agents/skills/wordpress-block-theme/SKILL.md"
      - "docs/architecture/specialist-agent-roster.md"
    expected_outputs:
      - ".ai/agents/ux-ui-architect.yaml"
      - ".ai/agents/design-system-agent.yaml"
      - ".ai/agents/block-development-agent.yaml"
      - ".ai/agents/template-engineer.yaml"
      - ".ai/agents/pattern-engineer.yaml"
      - ".ai/agents/performance-agent.yaml"
      - ".ai/agents/security-agent.yaml"
      - ".ai/agents/documentation-agent.yaml"
      - "docs/architecture/specialist-agent-roster.md"
      - ".ai/adapters/generated-manifest.json"
    acceptance_criteria:
      - "Every specialist contract validates against the Agent JSON Schema"
      - "Agent ownership and file scopes are explicit and non-conflicting"
      - "Implementation agents require all relevant human approval gates"
      - "Reviewer agents remain independent from implementation owners"
      - "All Cursor, Claude Code, and Codex adapters are generated and synchronized"
      - "GitHub Actions validation passes on the resulting commit"
    file_scope:
      include:
        - ".ai/agents/**"
        - ".ai/state/active-tasks.yaml"
        - ".ai/state/project-status.yaml"
        - ".ai/adapters/generated-manifest.json"
        - ".cursor/agents/**"
        - ".claude/agents/**"
        - ".codex/agents/**"
        - "docs/architecture/**"
      exclude:
        - "style.css"
        - "templates/**"
        - "parts/**"
        - "patterns/**"
        - "theme.json"
    approval:
      required: true
      status: "pending"
  - id: "TASK-UX-FOUNDATION-001"
    title: "Review and approve UX architecture and user journeys for selected launch archetypes"
    status: "READY"
    assigned_agent: "human"
    dependencies:
      - "TASK-AGENTS-002"
    inputs:
      - "docs/design/ux-foundation-discovery.md"
      - "docs/design/ux-architecture.md"
      - "docs/design/user-journeys.md"
      - ".ai/core/quality-gates.md"
    expected_outputs:
      - "Draft UX architecture for all selected launch archetypes"
      - "Draft site-owner and visitor journeys, including B2B cross-cutting requirements"
      - "Decision log identifying unresolved audience, customization, compatibility, and RTL inputs"
      - "Owner priority recorded: E-commerce first, Blog / Magazine second"
      - "International and Iranian users are first-class audiences across all seven archetypes"
      - "Persian (fa-IR), RTL/LTR, mixed-script content, localized formats, and Iran-specific plugin/service assumptions are specified"
      - "Iran-specific legal, payment, and regulatory claims are not assumed without current validation"
    acceptance_criteria:
      - "Owner-selected archetypes are reflected accurately: Business/Corporate, Agency/Portfolio, Blog/Magazine, SaaS/Product Landing, E-commerce, Education/LMS, Community/Membership"
      - "B2B is modeled as a cross-cutting context, not an additional visual archetype"
      - "Shared site-owner and visitor journeys are documented"
      - "Archetype-specific visitor journeys and theme/plugin responsibility boundaries are documented"
      - "Open product decisions and approval dependencies are explicit"
      - "E-commerce is the primary launch archetype and Blog / Magazine is the second priority"
      - "Every archetype has equivalent English/LTR and Persian/RTL journey coverage"
      - "Iranian localization requirements are cross-cutting and are reflected in UX, design-system, skill, and QA agent contracts"
      - "No production theme implementation files are created or modified"
    file_scope:
      include:
        - "docs/requirements/**"
        - "docs/design/**"
        - ".ai/state/**"
      exclude:
        - "theme.json"
        - "templates/**"
        - "parts/**"
        - "patterns/**"
        - "blocks/**"
    approval:
      required: true
      status: "pending"

  - id: "TASK-UX-INTERFACE-001"
    title: "Specify priority E-commerce and Blog / Magazine interfaces for international and Iranian users"
    status: "READY"
    assigned_agent: "human"
    dependencies:
      - "TASK-UX-FOUNDATION-001"
    inputs:
      - "docs/design/ux-architecture.md"
      - "docs/design/user-journeys.md"
      - ".ai/core/agent-contract.md"
    expected_outputs:
      - "docs/design/interface-specifications.md"
      - "Bilingual E-commerce interface and state specifications"
      - "Bilingual Blog / Magazine interface and editorial reading specifications"
      - "Open decisions for WordPress, WooCommerce, localization, and Iran-specific integrations"
    acceptance_criteria:
      - "E-commerce is primary and Blog / Magazine is second priority"
      - "Both archetypes specify English/LTR, Persian/RTL, and mixed-script behavior"
      - "Responsive, accessibility, empty, loading, error, and success states are documented"
      - "Theme and plugin responsibilities are explicit"
      - "Iran-specific provider claims are not made without validation"
      - "No production theme implementation files are modified"
      - "All repository changes are on a verified non-master branch and delivered through a pull request"
    file_scope:
      include:
        - "docs/design/**"
        - ".ai/state/**"
      exclude:
        - "theme.json"
        - "templates/**"
        - "parts/**"
        - "patterns/**"
        - "blocks/**"
    approval:
      required: true
      status: "pending"
