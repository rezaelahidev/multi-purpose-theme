        - ".ai/core/**"
        - ".ai/contracts/**"
        - ".ai/adapters/**"
        - "scripts/**"
        - "tests/**"
        - ".cursor/**"
        - ".claude/**"
        - ".codex/**"
        - "docs/architecture/**"
        - "README.md"
